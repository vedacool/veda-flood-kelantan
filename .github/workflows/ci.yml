# CI: the same checks as the local pre-commit hook, so nothing depends on a hook being installed (audit 2026-10-22).
# Actions are pinned to the exact commit of a release (version in the comment) so a moved tag cannot change what runs;
# Dependabot (.github/dependabot.yml) proposes updates weekly. All three run on Node 24 (Node 20 left the runners).
name: ci

# B-94 (24 Oct): Actions minutes are nearly used up until 1 Nov (private repo) - run once per change, on main and
# on pull requests only, never for doc / media-only changes, and cancel a run that a newer push replaces. When CI
# cannot run, the full suite + evals are run locally before every merge and the counts go in the PR description.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "docs/media/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.mp4"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "docs/media/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.mp4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read               # gitleaks lists a PR's commits on pull_request events (403 without it)

jobs:
  checks:
    runs-on: ubuntu-24.04           # pinned: ubuntu-latest is moving to Ubuntu 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0            # full history for the secret scan

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: pip install -r requirements-lock.txt

      - name: Guard rules + tests (offline; live tests skip without VEDA_LIVE=1)
        run: python -m pytest -q -p no:cacheprovider

      - name: CODEMAP is up to date
        run: python scripts/codemap.py --check

      - name: Known vulnerabilities in dependencies
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements-lock.txt

      - name: Secret scan of the whole git history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The judges' path (23 Oct): build the image and use it exactly as the README says - SAMPLE_MODE, no .env, no keys.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the image
        run: docker build -t veda:ci .

      - name: SAMPLE_MODE smoke test (the API inside the container)
        run: |
          docker run -d --name veda -p 8000:8000 -e SAMPLE_MODE=true veda:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health > /dev/null && break; sleep 2; done
          curl -fs localhost:8000/health | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status'] == 'ok' and d['sample_mode'], d"
          curl -fs -X POST localhost:8000/run -H 'Content-Type: application/json' \
            -d '{"question": "Rantau Panjang banjir tak esok?"}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['output']); assert d['status'] == 'success' and 'Bukan amaran rasmi' in d['output']"

      - name: Container logs
        if: always()
        run: docker logs veda 2>&1 | tail -40

      - name: Safety evals inside the image, 3 repeat runs (pass^3)
        run: |
          for i in 1 2 3; do
            echo "== eval run $i of 3"
            docker run --rm -e SAMPLE_MODE=true veda:ci python scripts/run_evals.py
          done
