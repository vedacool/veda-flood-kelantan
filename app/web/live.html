<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEDA - live log</title>
<link rel="icon" href="data:,">
<style>
  /* Judge / operator screen (Cowork weekend plan B6, 24 Oct): every trace step word for word, as it happens.
     Plain HTML/CSS/JS, nothing loaded from outside. */
  :root { --bg: #f4f4f1; --fg: #1c1c1a; --muted: #5a5a54; --card: #ffffff; --line: #d6d5cf; --accent: #1f5f8b;
          --on-accent: #fff; --amber: #a85f00; --amber-bg: #fff3df; --red: #b3261e; --wait-bg: #fff6c2; --wait: #6b5600;
          --c-system: #5a5c62; --c-coordinator: #1f5f8b; --c-data: #1e6b3a; --c-forecast: #7a3fa0; --c-critic: #a3271f;
          --c-nemotron: #4f7d00; --req: #1f5f8b; --req-bg: #e6f0f8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --fg: #ececea; --muted: #a9a9a3; --card: #20201f; --line: #3a3a37; --accent: #82b8de;
            --on-accent: #141413; --amber: #f0b45a; --amber-bg: #3a2a10; --red: #f08a80; --wait-bg: #3a3410; --wait: #f2dc6b;
            --req: #82b8de; --req-bg: #1d2a33; }
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 1rem/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .lhead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: var(--card);
           border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  .lhead h1 { font-size: 1.2rem; margin: 0 auto 0 0; }
  button, select { font: inherit; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
                   background: var(--card); color: var(--fg); cursor: pointer; }
  /* B-96: a selected choice is bold + outlined, never filled - /live has no filled button */
  button[aria-pressed="true"] { border: 3px solid var(--accent); font-weight: 800; }
  .seg2 { display: inline-flex; gap: 6px; }
  .hint { margin: 0 0 10px; font-weight: 600; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; max-width: 1200px; margin: 0 auto; padding: 16px; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } aside { order: -1; } }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .controls select { max-width: 100%; flex: 1 1 260px; }
  #status { color: var(--muted); margin: 0 0 12px; }
  #feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .msg { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--who, var(--c-system));
         border-radius: 12px; padding: 10px 12px; word-break: break-word; }
  .msg.fallback, .msg.retrying { border-color: var(--amber); background: var(--amber-bg); }
  .msg.failed { border-color: var(--red); }
  .msg.wait { background: var(--wait-bg); border-color: var(--wait); color: var(--wait); font-weight: 700; }
  .msg.state { background: transparent; border: 0; border-top: 2px solid var(--line); border-radius: 0; padding: 8px 0 0;
               color: var(--muted); font-weight: 700; }
  .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .chip { display: inline-block; padding: 1px 10px; border-radius: 999px; background: var(--who, var(--c-system)); color: #fff;
          font-weight: 700; }
  .to { color: var(--muted); font-weight: 700; }
  .act { font-family: ui-monospace, Consolas, monospace; color: var(--muted); }
  .clock { margin-left: auto; font-family: ui-monospace, Consolas, monospace; color: var(--muted); }
  .out { margin: 6px 0 0; }
  .dec, .inp { margin: 4px 0 0; color: var(--muted); }
  .tag { font-weight: 700; color: var(--amber); }
  .msg.req { background: var(--req-bg); border-color: var(--req); border-width: 2px 2px 2px 8px; }
  .req-tag { color: var(--on-accent); background: var(--req); padding: 0 8px; border-radius: 999px; }
  .meta { margin: 4px 0 0; font-size: .85rem; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  aside .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; position: sticky; top: 76px; }
  aside h2 { font-size: 1rem; margin: 0 0 8px; }
  .who { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .who li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; }
  .who li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--line); flex: none; }
  .who li.working { background: var(--wait-bg); font-weight: 700; }
  .who li.working::before { background: var(--who); animation: pulse 1s infinite; }
  .who li.done::before { background: var(--who); }
  .who small { margin-left: auto; color: var(--muted); }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .who li.working::before { animation: none; } }
  .note { color: var(--muted); }
  [hidden] { display: none !important; }
  main, aside { min-width: 0; }   /* B-96: no sideways scroll on a phone */
  .top { max-width: 1200px; margin: 0 auto; padding: 16px 16px 0; }
  .top .controls { margin-bottom: 8px; }
  .controls select { min-width: 0; width: 100%; }
  #rec { max-width: 100%; }
</style>
</head>
<body>
<!--VEDA:TOP-->
<!-- B-96: the shared frame above (its VEDA link goes home); this page's own heading below -->
<div class="lhead">
  <h1>VEDA · live log</h1>
  <span class="note" id="h-note">The question itself is never shown here.</span>
</div>
<!-- B-96: the controls first on every width (in the demo, Play is what a visitor needs) -->
<div class="top">
  <div class="controls">
    <span class="seg2" role="group" aria-label="Live or replay">
      <button type="button" id="b-live" aria-pressed="true">Live</button>
      <button type="button" id="b-replay" aria-pressed="false">Replay</button></span>
    <select id="rec" aria-label="Recorded run" hidden></select>
    <span class="seg2" role="group" aria-label="Speed" id="speeds" hidden>
      <button type="button" data-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-speed="4" aria-pressed="false">4×</button></span>
    <button type="button" id="b-play" hidden>Play ▶</button>
  </div>
  <p class="hint" id="hint" hidden></p>
</div>
<div class="wrap">
  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="note" id="rnote" hidden></p>
    <ol id="feed"></ol>
  </main>
  <aside><div class="panel">
    <h2>Who is working</h2>
    <ul class="who" id="who"></ul>
    <p class="note">Word for word from the trace (<code>logs/trace-&lt;run_id&gt;.jsonl</code>).</p>
  </div></aside>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
// The two public header lines follow the main page's EN | BM toggle (wording review 24 Oct); the log stays English.
const HEAD = {
  en: { hint: "Press play to watch each agent step, recorded live.",
        note: "The question itself is never shown here.",
        waiting: "Waiting for a question… Ask one on VEDA's main page and every step appears here as it happens." },
  ms: { hint: "Tekan main untuk melihat setiap langkah ejen, dirakam secara langsung.",
        note: "Soalan itu sendiri tidak pernah ditunjukkan di sini.",
        waiting: "Menunggu soalan… Tanya di halaman utama VEDA dan setiap langkah akan muncul di sini ketika ia berlaku." },
};
const pageLang = () => { try { return localStorage.getItem("veda.lang") === "ms" ? "ms" : "en"; } catch (e) { return "en"; } };
function applyHeadLang() {
  const h = HEAD[pageLang()];
  $("h-note").textContent = h.note; $("h-note").lang = pageLang();
  $("hint").textContent = h.hint; $("hint").lang = pageLang();
  if (Object.values(HEAD).some((x) => x.waiting === $("status").textContent)) $("status").textContent = h.waiting;
}
window.addEventListener("storage", (e) => { if (e.key === "veda.lang") applyHeadLang(); });
// B-96: the frame's EN | BM switches this page in place
window.vedaSetLang = (l) => { try { localStorage.setItem("veda.lang", l); } catch (e) { /* private window */ }
  applyHeadLang(); if (window.vedaFrameLang) window.vedaFrameLang(l); };
const AGENTS = [  // name in the trace -> colour token
  ["System", "--c-system"], ["Coordinator", "--c-coordinator"], ["Data & Reconciler", "--c-data"],
  ["Forecast", "--c-forecast"], ["Critic", "--c-critic"], ["Nemotron 3.5 Super VL", "--c-nemotron"]];
const COLOUR = Object.fromEntries(AGENTS);
const NEMOTRON = "Nemotron 3.5 Super VL";
const HIDDEN = /^\(the question is not shown/;           // said once in the header instead of on every bubble
const REQUESTS =["critic.request", "data.request", "verdict.recomputed"];   // agents asking each other, shown apart
let mode = "live", speed = 1, t0 = null, timer = null, source = null, waitEl = null, recorded = null, runTs0 = null;

function whoPanel() {
  $("who").replaceChildren(...AGENTS.map(([name, c]) => {
    const li = document.createElement("li");
    li.dataset.name = name; li.style.setProperty("--who", `var(${c})`);
    li.innerHTML = `<span></span><small></small>`;
    li.firstChild.textContent = name;
    return li;
  }));
}
function working(name, note) {
  document.querySelectorAll("#who li").forEach((li) => {
    if (li.classList.contains("working")) { li.classList.remove("working"); li.classList.add("done"); }
    if (li.dataset.name === name) { li.classList.add("working"); li.classList.remove("done"); li.querySelector("small").textContent = note || ""; }
  });
}
function clockText(rec) {
  if (mode === "live") return t0 === null ? "" : ((performance.now() - t0) / 1000).toFixed(1) + " s";
  const ts = Date.parse(rec.timestamp);
  return isNaN(ts) || runTs0 === null ? "" : ((ts - runTs0) / 1000).toFixed(0) + " s";
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function modelName(id) { return /super-vl/i.test(id || "") ? NEMOTRON : (id || "the model"); }

function showWait(rec) {
  clearWait();
  const d = rec.details || {};
  waitEl = el("li", "msg wait");
  waitEl.style.setProperty("--who", "var(--c-nemotron)");
  waitEl.textContent = `Waiting for ${modelName(d.expected || d.model)}… (${rec.agent_name}${d.attempt > 1 ? `, try ${d.attempt}` : ""})`;
  $("feed").append(waitEl);
  working(NEMOTRON, rec.agent_name);
  waitEl.scrollIntoView({ block: "nearest" });
}
function clearWait() { if (waitEl) { waitEl.remove(); waitEl = null; } }

function add(rec) {
  if (rec.action === "ai.waiting") { showWait(rec); return; }
  if (rec.action === "run_start") {
    $("feed").replaceChildren(); whoPanel(); t0 = performance.now(); runTs0 = Date.parse(rec.timestamp);
    $("status").textContent = `Run ${rec.run_id} (${rec.mode === "sample" ? "SAMPLE_MODE: offline scenes" : "live"})`;
  }
  if (rec.action === "nightshift.chat") clearWait();
  if (rec.action === "replay" && rec.output_summary) {     // say plainly what data this run is on
    const made = /SYNTHETIC/.test(rec.output_summary);
    $("status").textContent += ` · ${made ? "made-up test scene" : "past flood replay"}: ${rec.output_summary}`;
  }
  const who = rec.agent_name || "System";
  if (rec.action === "state") {
    const li = el("li", "msg state", `${rec.input_summary} · ${rec.decision || ""}`);
    $("feed").append(li); li.scrollIntoView({ block: "nearest" });
    return;
  }
  const request = REQUESTS.includes(rec.action);
  const li = el("li", `msg ${rec.status || ""}${request ? " req" : ""}`);
  li.style.setProperty("--who", `var(${COLOUR[who] || "--c-system"})`);
  const top = el("div", "top");
  top.append(el("span", "chip", who));
  if (rec.target_agent) top.append(el("span", "to", "→ " + rec.target_agent));
  top.append(el("span", "act", rec.action + (rec.status && rec.status !== "success" ? ` · ${rec.status}` : "")));
  if (rec.action === "ai.fallback") top.append(el("span", "tag", "AI fallback"));
  if (rec.action === "critic.ai_judgement") top.append(el("span", "tag req-tag", "AI judgement"));   // Part 7
  if (request) top.append(el("span", "tag req-tag", "request"));
  top.append(el("span", "clock", clockText(rec)));
  li.append(top);
  if (rec.input_summary && !HIDDEN.test(rec.input_summary)) li.append(el("p", "inp", "in: " + rec.input_summary));
  if (rec.output_summary) li.append(el("p", "out", rec.output_summary));
  if (rec.decision) li.append(el("p", "dec", rec.decision));
  const d = rec.details || {};
  if (rec.action === "nightshift.chat" && d.served_model) {
    li.append(el("p", "dec", `answered by ${d.served_model}${d.receipt_id ? `, receipt ${d.receipt_id}` : ""}${rec.duration_ms ? `, ${(rec.duration_ms / 1000).toFixed(1)} s` : ""}`));
  }
  const meta = [rec.status && `status ${rec.status}`, rec.confidence != null && `confidence ${rec.confidence}`,
    rec.retry_count ? `retry ${rec.retry_count}` : null, rec.source && `source ${rec.source}`].filter(Boolean);
  if (meta.length) li.append(el("p", "meta", meta.join(" · ")));
  $("feed").append(li);
  li.scrollIntoView({ block: "nearest" });
  working(rec.action === "run_end" ? "" : who, rec.action);
  if (rec.action === "run_end") { $("status").textContent += " · finished"; working(""); }
}

// ---------- live ----------
function goLive() {
  stopReplay();
  mode = "live"; pressMode(); $("rnote").hidden = true;
  $("b-play").hidden = true; $("hint").hidden = true;
  $("feed").replaceChildren(); whoPanel();
  $("status").textContent = HEAD[pageLang()].waiting;
  if (source) source.close();
  source = new EventSource("/live/stream");
  source.addEventListener("trace", (ev) => add(JSON.parse(ev.data)));
  source.onerror = () => { $("status").textContent = "Connection lost - reconnecting…"; };
}

// ---------- replay of a recorded run (its own timestamps; Nemotron calls wait as long as they took) ----------
function stopReplay() { clearTimeout(timer); timer = null; clearWait(); }
function pressMode() {          // Live · Replay: the replay's run list and speed show only in Replay
  $("b-live").setAttribute("aria-pressed", String(mode === "live"));
  $("b-replay").setAttribute("aria-pressed", String(mode === "replay"));
  $("rec").hidden = $("speeds").hidden = mode !== "replay";
}
function loadRecorded(records, note, wait) {
  if (source) { source.close(); source = null; }
  stopReplay();
  mode = "replay"; pressMode();
  recorded = records; $("b-play").hidden = false;
  $("rnote").hidden = !note; $("rnote").textContent = note ? "Recorded run: " + note : "";
  $("hint").hidden = !wait;
  if (wait) { $("feed").replaceChildren(); whoPanel(); $("status").textContent = ""; return; }   // demo: press Play
  play();
}
async function loadChosen(wait) {
  if (!$("rec").value) return;
  const r = await fetch("/trace/recorded/" + encodeURIComponent($("rec").value)).then((x) => x.json());
  loadRecorded(r.records || [], r.note, wait);
}
function play() {
  stopReplay();
  $("feed").replaceChildren(); whoPanel();
  let i = 0;
  const next = () => {
    if (i >= recorded.length) { timer = null; return; }
    const rec = recorded[i];
    add(rec);
    i += 1;
    if (i >= recorded.length) return;
    const nxt = recorded[i];
    const gap = Math.max(0, Date.parse(nxt.timestamp) - Date.parse(rec.timestamp));
    if (nxt.action === "nightshift.chat") showWait({ agent_name: nxt.agent_name, details: { expected: (nxt.details || {}).served_model || "nvidia/nemotron-3.5-super-vl" } });
    timer = setTimeout(next, Math.min(gap / speed, 120000));
  };
  next();
}

$("b-live").addEventListener("click", goLive);
$("b-play").addEventListener("click", () => { $("hint").hidden = true; if (recorded) play(); });
$("b-replay").addEventListener("click", () => loadChosen(true));
function setSpeed(s) {
  speed = s === 4 ? 4 : 1;
  document.querySelectorAll("[data-speed]").forEach((x) => x.setAttribute("aria-pressed", String(Number(x.dataset.speed) === speed)));
}
document.querySelectorAll("[data-speed]").forEach((b) => b.addEventListener("click", () => setSpeed(Number(b.dataset.speed))));
$("rec").addEventListener("change", () => loadChosen(true));

whoPanel();
// B-96: the run a judge should see first - the Critic asking the Data agent for more data (Wakaf Bharu, 24 Oct 20:10)
const FEATURED = "20261024-201011";
const listed = fetch("/trace/recorded").then((r) => r.json()).then((list) => {
  list.forEach((x) => {
    const o = document.createElement("option");
    o.value = x.name;
    o.textContent = `${(x.started || "").replace("T", " ").replace("Z", " UTC")} · ${x.question || x.run_id}`;
    $("rec").append(o);
  });
  const f = list.find((x) => (x.name || "").includes(FEATURED));
  if (f) $("rec").value = f.name;
}).catch(() => {});
const params = new URLSearchParams(location.search);
if (params.get("run")) {  // one run from logs/ (this computer only), replayed from its trace
  fetch("/trace/run/" + encodeURIComponent(params.get("run"))).then(async (r) => {
    const body = await r.json();
    if (!r.ok) throw new Error((body.error || {}).message || "HTTP " + r.status);
    if (params.get("speed")) setSpeed(Number(params.get("speed")));
    loadRecorded(body.records, null);
  }).catch((e) => { $("status").textContent = e.message; });
} else if (params.get("recorded")) {
  fetch("/trace/recorded/" + encodeURIComponent(params.get("recorded"))).then((r) => r.json())
    .then((b) => { if (params.get("speed")) setSpeed(Number(params.get("speed"))); loadRecorded(b.records || [], b.note); });
} else {
  // B-96: in the demo (offline) nothing runs live - open in Replay on the featured run, waiting for Play
  fetch("/health").then((r) => r.json()).then((h) => {
    if (h.sample_mode) listed.then(() => loadChosen(true)); else goLive();
  }).catch(() => goLive());
}
applyHeadLang();
</script>
<!--VEDA:FOOT-->
</body>
</html>
