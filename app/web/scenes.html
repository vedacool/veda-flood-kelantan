<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEDA - test scenes</title>
<link rel="icon" href="data:,">
<style>
  /* B-96 Scenes (Cowork wireframes v3): the list = two groups of whole-row links; one scene = one page, three numbered
     steps, nothing collapses except the technical log and per-value details. One filled button (Start test); labels
     never look tappable; plain words on screen, raw text only behind "Show technical log". Text >= 16 px, taps >= 44 px,
     works at 375 px; desktop >= 1024 px: steps 1-2 left, step 3 right. Demo data only - never a live JPS reading. */
  :root { --bg: #f6f5f1; --fg: #1c1c1a; --muted: #55554f; --card: #ffffff; --line: #d6d5cf; --accent: #1f5f8b;
          --on-accent: #ffffff; --ok: #1e6b3a; --bad: #a3271f; --warn-text: #8a4a00;
          --b-normal: #cfe8d6; --b-alert: #f6d548; --b-warning: #f2933a; --b-danger: #c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --fg: #eeeeea; --muted: #b0b0a9; --card: #212120; --line: #3b3b38; --accent: #82b8de;
            --on-accent: #151514; --ok: #7fd09a; --bad: #f08a80; --warn-text: #f0b45a; --b-normal: #2f5a3b; }
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 8px 0 12px; }
  h2 { font-size: 1.2rem; margin: 24px 0 8px; }
  h3 { font-size: 1.05rem; margin: 20px 0 6px; }
  p { margin: 8px 0; }
  a { color: var(--accent); }
  button { font: inherit; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary { min-height: 52px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--accent); cursor: pointer;
             background: var(--accent); color: var(--on-accent); font-weight: 700; width: 100%; margin: 12px 0 4px; }
  .primary:disabled { opacity: .7; cursor: default; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer;
             min-height: 44px; }
  .sub, .note { color: var(--muted); }
  .sub { font-size: .9rem; }
  [hidden] { display: none !important; }
  /* the list: whole-row links */
  .items { list-style: none; padding: 0; margin: 0 0 8px; border-top: 1px solid var(--line); }
  .items li { border-bottom: 1px solid var(--line); }
  .items a { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 4px; color: inherit; text-decoration: none; }
  .items a:hover b { text-decoration: underline; }
  .items .it { flex: 1; display: flex; flex-direction: column; }
  .items .chev { font-size: 1.5rem; color: var(--muted); }
  /* one scene */
  .step h2 { display: flex; gap: 10px; align-items: baseline; }
  .step .num { color: var(--muted); font-weight: 800; }
  .question { margin: 12px 0; font-size: 1.1rem; font-weight: 700; border-left: 6px solid var(--accent); padding: 6px 12px;
              background: var(--card); border-radius: 0 8px 8px 0; }
  .row { border-top: 1px solid var(--line); padding: 10px 0; }
  .row:first-child { border-top: 0; }
  .row .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; }
  #s-source a { display: inline-block; padding: 10px 0; }         /* a 44 px tap in a grey line */
  .stale { color: var(--warn-text); font-weight: 700; margin: 4px 0; }
  .origin { color: var(--muted); font-size: .9rem; margin: 2px 0; }
  .bar { position: relative; height: 8px; border-radius: 4px; display: flex; overflow: hidden; margin: 8px 0 4px; }
  .bar span { height: 100%; }
  .bar .marker { position: absolute; top: 0; width: 4px; height: 8px; background: var(--fg); transform: translateX(-2px); }
  details.more > summary { list-style: none; color: var(--accent); text-decoration: underline; cursor: pointer;
                           min-height: 44px; display: inline-flex; align-items: center; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more ul { margin: 0 0 4px; padding-left: 20px; }
  .expect { list-style: none; padding: 0; margin: 0; }
  .expect li { display: flex; gap: 12px; justify-content: space-between; border-top: 1px solid var(--line); padding: 10px 0; }
  .expect li:first-child { border-top: 0; }
  .expect .why { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  .expect .instead { margin: 4px 0 0; color: var(--bad); font-weight: 700; }
  .mark { flex: none; min-width: 6.5em; text-align: right; font-weight: 800; color: var(--muted); }
  .mark.ok { color: var(--ok); }
  .mark.bad { color: var(--bad); }
  .score { font-size: 1.15rem; font-weight: 800; margin: 16px 0 4px; }
  .how { padding-left: 0; list-style: none; margin: 0; }
  .how li { margin: 0 0 8px; }
  .links { list-style: none; padding: 0; margin: 12px 0; }
  .links li a { min-height: 44px; display: inline-flex; align-items: center; }
  #r-log { font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; border-left: 3px solid var(--line);
           padding-left: 10px; margin: 4px 0; }
  .last { border-top: 1px solid var(--line); padding-top: 12px; }
  .last a { min-height: 44px; display: inline-flex; align-items: center; }
  @media (min-width: 1024px) {
    main.wide { max-width: 1200px; padding: 24px 32px 48px; }
    .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
    .two #test h2:first-child { margin-top: 24px; }
  }
</style>
</head>
<body>
<!--VEDA:TOP-->
<main id="scenes">
  <!-- the list -->
  <section id="list" hidden>
    <h1 data-t="list_title"></h1>
    <p data-t="list_intro"></p>
    <h2 data-t="group_real"></h2>
    <ul class="items" id="list-real"></ul>
    <h2 data-t="group_made"></h2>
    <ul class="items" id="list-made"></ul>
  </section>

  <!-- one scene: three numbered steps -->
  <section id="one" hidden>
    <h1 id="s-title"></h1>
    <div class="two">
      <div>
        <section class="step">
          <h2><span class="num">1</span><span data-t="step1"></span></h2>
          <p id="s-story"></p>
          <blockquote class="question" id="s-question"></blockquote>
          <p class="sub" id="s-source"></p>
        </section>
        <section class="step">
          <h2><span class="num">2</span><span data-t="step2"></span></h2>
          <p class="sub" data-t="gauge_note"></p>
          <p class="sub" id="s-bands"></p>
          <div id="s-data"></div>
        </section>
      </div>
      <section class="step" id="test">
        <h2><span class="num">3</span><span data-t="step3"></span></h2>
        <ol class="expect" id="s-expect"></ol>
        <button type="button" class="primary" id="start" data-t="start"></button>
        <p class="note" id="status" role="status" aria-live="polite"></p>
        <div id="result" hidden>
          <p class="score" id="r-score"></p>
          <h3 data-t="how_title"></h3>
          <ol class="how" id="r-how"></ol>
          <ul class="links">
            <li><a id="r-full" data-t="full_answer"></a></li>
            <li><a href="/how-it-works#live" id="r-live" data-t="live_link"></a></li>
            <li><details class="more" id="r-logbox"><summary id="r-logsum"></summary><div id="r-log" lang="en"></div></details></li>
          </ul>
          <p class="last"><span id="r-ask" hidden><span data-t="feedback_q"></span> <a id="r-feedback" data-t="tell_us"></a> ·
            </span><button type="button" class="linkish" id="r-again" data-t="again"></button> · <a id="r-next" data-t="next"></a></p>
        </div>
      </section>
    </div>
  </section>
</main>

<script>
"use strict";
const UI = {
  en: { list_title: "Test VEDA yourself",
    list_intro: "Each test shows the situation and the data, tells you what VEDA should say, then you run it and compare.",
    group_real: "Real flood · November 2024", group_made: "Made-up tests",
    step1: "The situation", step2: "The data at that moment", step3: "What VEDA should do → what it did",
    real: "Real flood, Nov 2024", made: "Made-up test", people: "the people are imagined", source: "source:",
    gauge_note: "A river level post (gauge) measures how high the river is. JPS sets lines on each one: Alert, Warning and Danger.",
    here: "here", upstream: "upstream", old: "{h} old, too old to count as 'now'",
    bands: { normal: "Normal", alert: "Alert", warning: "Warning", danger: "Danger" },
    o_news: "news report: {s}", o_jps: "JPS station list", o_demo: "demo data", o_om: "Open-Meteo archive", o_gov: "data.gov.my",
    details: "details", d_level: "Reading {v} m at {when}", d_line: "{b} line {v} m",
    d_change: "Change: {c1} in 1 hour · {c3} in 3 hours", d_tide: "The tide affects this one.",
    no_change: "no change", up: "up {cm} cm", down: "down {cm} cm",
    rain_here: "Rain here", rain_up: "Rain upstream", rain_here_val: "{m12} mm in 12 h · {m24} mm in 24 h",
    rain_up_val: "{m24} mm in 24 h · {m72} mm in 3 days", heavy: "heavy", no_rain: "Rain: not read in this check",
    met: "MetMalaysia warnings", met_skipped: "not available for this date (data.gov.my keeps no 2024 archive)",
    met_none: "none active", met_not_read: "not read in this quick check",
    exp_source: "Source: {s}", pending: "–", match: "✓ match", different: "✗ different",
    start: "Start test", again: "Run again", running: "VEDA is checking…",
    stage: { plan: "Understanding the question", gather: "Checking river levels, rain and warnings", forecast: "Working out the risk",
             draft: "Writing the answer", critique: "Checking the answer", revise: "Fixing the answer" },
    busy: "VEDA is answering another question - try again in a minute.", failed: "The test could not run: {why}",
    score: "{n} of {m} matched", veda_said: "VEDA said: {v}", how_title: "How VEDA got there",
    full_answer: "See the full answer VEDA gave ›", live_link: "See a real live run with Nemotron ›", show_log: "Show technical log ▾", hide_log: "Hide technical log ▴",
    feedback_q: "Did VEDA match what you expected?", tell_us: "Tell us", next: "Next test ›",
  },
  ms: { list_title: "Uji VEDA sendiri",
    list_intro: "Setiap ujian menunjukkan keadaan dan data, memberitahu apa yang patut VEDA katakan, kemudian anda jalankan dan bandingkan.",
    group_real: "Banjir sebenar · November 2024", group_made: "Ujian rekaan",
    step1: "Keadaannya", step2: "Data pada masa itu", step3: "Apa yang patut VEDA lakukan → apa yang dilakukannya",
    real: "Banjir sebenar, Nov 2024", made: "Ujian rekaan", people: "orang dalam cerita ini rekaan", source: "sumber:",
    gauge_note: "Stesen paras air mengukur ketinggian air sungai. JPS menetapkan garis pada setiap stesen: Waspada, Amaran dan Bahaya.",
    here: "di sini", upstream: "di hulu", old: "berusia {h}, terlalu lama untuk dikira 'sekarang'",
    bands: { normal: "Normal", alert: "Waspada", warning: "Amaran", danger: "Bahaya" },
    o_news: "laporan berita: {s}", o_jps: "senarai stesen JPS", o_demo: "data demo", o_om: "arkib Open-Meteo", o_gov: "data.gov.my",
    details: "butiran", d_level: "Bacaan {v} m pada {when}", d_line: "Garis {b} {v} m",
    d_change: "Perubahan: {c1} dalam 1 jam · {c3} dalam 3 jam", d_tide: "Dipengaruhi air pasang.",
    no_change: "tiada perubahan", up: "naik {cm} cm", down: "turun {cm} cm",
    rain_here: "Hujan di sini", rain_up: "Hujan di hulu", rain_here_val: "{m12} mm dalam 12 jam · {m24} mm dalam 24 jam",
    rain_up_val: "{m24} mm dalam 24 jam · {m72} mm dalam 3 hari", heavy: "lebat", no_rain: "Hujan: tidak dibaca dalam semakan ini",
    met: "Amaran MetMalaysia", met_skipped: "tiada untuk tarikh ini (data.gov.my tidak menyimpan arkib 2024)",
    met_none: "tiada yang aktif", met_not_read: "tidak dibaca dalam semakan pantas ini",
    exp_source: "Sumber: {s}", pending: "–", match: "✓ sepadan", different: "✗ berbeza",
    start: "Mula ujian", again: "Jalankan semula", running: "VEDA sedang menyemak…",
    stage: { plan: "Memahami soalan", gather: "Menyemak paras sungai, hujan dan amaran", forecast: "Menilai risiko",
             draft: "Menulis jawapan", critique: "Menyemak jawapan", revise: "Membetulkan jawapan" },
    busy: "VEDA sedang menjawab soalan lain - sila cuba lagi dalam seminit.", failed: "Ujian tidak dapat dijalankan: {why}",
    score: "{n} daripada {m} sepadan", veda_said: "Jawapan VEDA: {v}", how_title: "Bagaimana VEDA sampai ke jawapan",
    full_answer: "Lihat jawapan penuh VEDA ›", live_link: "Lihat rakaman langsung sebenar dengan Nemotron ›",
    show_log: "Tunjuk log teknikal ▾", hide_log: "Sembunyikan log teknikal ▴",
    feedback_q: "Adakah VEDA sepadan dengan jangkaan anda?", tell_us: "Beritahu kami", next: "Ujian seterusnya ›",
  },
};
const STAGE = { "Understanding the question": "plan", "Checking river gauges, rain and warnings": "gather",
  "Working out the risk": "forecast", "Writing the answer": "draft", "Checking the answer": "critique", "Fixing the answer": "revise" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fill = (key, vals) => Object.entries(vals).reduce((s, [k, v]) => s.replace(`{${k}}`, v), t(key));
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private window */ } } };
let lang = new URLSearchParams(location.search).get("lang") || store.get("veda.lang") || "en";
if (!Object.hasOwn(UI, lang)) lang = "en";            // not UI[lang]: ?lang=constructor would pass (audit)
const t = (k) => UI[lang][k];
let all = null, scene = null, checked = null, running = false, rawLines = [];
let publicDemo = false;                // /feedback exists in the public demo only (/health "demo"), as on the answer page
const sceneId = (location.pathname.match(/^\/scenes\/([a-z0-9-]+)\/?$/) || [])[1] || null;

function when(text) {                 // "2024-11-26 18:00" -> "26 Nov 2024, 6:00 pm" / "26 Nov 2024, 6.00 petang"
  const [d, hm] = text.split(" "), [y, m, dd] = d.split("-").map(Number), [h, mi] = hm.split(":").map(Number);
  const mon = (lang === "ms" ? "Jan Feb Mac Apr Mei Jun Jul Ogo Sep Okt Nov Dis" : "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec").split(" ");
  const h12 = ((h + 11) % 12) + 1, part = lang === "ms" ? (h < 12 ? "pagi" : h < 19 ? "petang" : "malam") : (h < 12 ? "am" : "pm");
  const sep = lang === "ms" ? "." : ":";                            // BM "7.30 malam", EN "7:30 pm" (A-P3-35)
  return `${dd} ${mon[m - 1]} ${y}, ${h12}${sep}${String(mi).padStart(2, "0")} ${part}`;
}
const level = (code) => (all && all.levels[code] && all.levels[code][lang]) || code;
const hours = (min) => min >= 120 ? `${(min / 60).toFixed(min % 60 ? 1 : 0)} h` : `${min} min`;
const cm = (m) => m == null ? null : Math.round(m * 100);
function change(c) { const v = cm(c); return v == null ? "-" : v === 0 ? t("no_change") : t(v > 0 ? "up" : "down").replace("{cm}", Math.abs(v)); }
const publisher = (source) => source[lang].split(",")[0];                      // "Bernama, 26 Nov 2024, ..." -> "Bernama"
const shortSource = (source) => source[lang].split(", ").slice(0, 2).join(", ").replace(/ \d{4}$/, "");   // "Bernama, 26 Nov"

// the official band of a reading, from the gauge's own JPS lines (input data, not VEDA's verdict)
function band(g) {
  const th = g.thresholds, v = g.level_m;
  if (th.danger != null && v >= th.danger) return "danger";
  if (th.warning != null && v >= th.warning) return "warning";
  if (th.alert != null && v >= th.alert) return "alert";
  return "normal";
}
function bar(g) {
  const th = g.thresholds;
  if (th.alert == null || th.danger == null) return "";
  const lo = Math.min(g.level_m, th.normal != null ? th.normal : th.alert) - (th.danger - th.alert) * 0.5;
  const hi = Math.max(g.level_m, th.danger) + (th.danger - th.alert) * 0.5;
  const pct = (v) => ((v - lo) / (hi - lo)) * 100;
  const w = th.warning != null ? th.warning : (th.alert + th.danger) / 2;
  const seg = (from, to, colour) => `<span style="width:${pct(to) - pct(from)}%;background:var(${colour})"></span>`;
  return `<div class="bar" aria-hidden="true">${seg(lo, th.alert, "--b-normal")}${seg(th.alert, w, "--b-alert")}` +
    `${seg(w, th.danger, "--b-warning")}${seg(th.danger, hi, "--b-danger")}<i class="marker" style="left:${pct(g.level_m)}%"></i></div>`;
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  if (window.vedaFrameLang) window.vedaFrameLang(lang);              // the shared frame's words (top bar, strip, footer)
  if (all) render();
}

function render() {
  if (!sceneId) return renderList();
  scene = all.scenes.find((s) => s.id === sceneId);
  if (!scene) return renderList();
  const d = scene.data;
  $("one").hidden = false;
  $("scenes").classList.add("wide");
  $("s-title").textContent = `${scene.town} · ${when(scene.at)}`;
  $("s-story").textContent = scene.story[lang];
  $("s-question").textContent = `“${d.question[lang]}”`;
  $("s-source").innerHTML = sourceLine(d);
  $("s-data").innerHTML = dataRows(d);
  $("s-bands").textContent = all.bands[lang];
  $("start").textContent = t(running ? "running" : "start");
  $("start").hidden = !!checked;                                    // after a run: "Run again" in the last line
  $("r-logsum").textContent = t($("r-logbox").open ? "hide_log" : "show_log");
  const p = new URLSearchParams({ replay: scene.replay, at: scene.at, place: scene.town, lang });
  $("r-full").href = "/?" + p;
  $("r-live").href = `/how-it-works?lang=${lang}#live`;
  $("r-feedback").href = "/feedback?lang=" + lang;
  const next = all.scenes[(all.scenes.indexOf(scene) + 1) % all.scenes.length];
  $("r-next").href = `/scenes/${next.id}?lang=${lang}`;
  renderExpect();
  if (checked) renderCheck();
}

// step 1: ONE grey source line - what is real, what is not, and the article(s) the river readings come from
function sourceLine(d) {
  if (d.kind !== "replay") return `${esc(t("made"))} · ${esc(t("people"))}`;
  const links = (scene.news || []).map((a) => `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(shortSource(a.source))} ›</a>`);
  return `${esc(t("real"))} · ${esc(t("people"))}${links.length ? ` · ${esc(t("source"))} ${links.join(", ")}` : ""}`;
}

// step 2: where the values of a row come from, as plain grey text (Cowork B-91b/c; B-96): "news report" only for the
// values the cited article states (the reviewed allow-list, marked by the server as g.news), "JPS station list" for an
// official line that the article does not state (g.lines), "demo data" for the rest (trends, made-up readings)
function origin(g) {
  const parts = [...new Set((g.news || []).map((n) => publisher(n.source)))].map((s) => t("o_news").replace("{s}", s));
  if ((g.lines || []).length) parts.push(t("o_jps"));
  if (g.demo) parts.push(t("o_demo"));
  return `<p class="origin">${esc(parts.join(" · "))}</p>`;
}
function valueOrigin(g, field) {
  const n = (g.news || []).find((x) => x.field === field);
  if (n) return t("o_news").replace("{s}", publisher(n.source));
  return (g.lines || []).some((x) => x.field === field) ? t("o_jps") : t("o_demo");
}
function gaugeDetails(g) {
  const items = [`${fill("d_level", { v: g.level_m, when: when(g.at) })} · ${valueOrigin(g, "level")}`];
  for (const k of ["alert", "warning", "danger"]) {
    if (g.thresholds[k] != null) items.push(`${fill("d_line", { b: t("bands")[k], v: g.thresholds[k] })} · ${valueOrigin(g, k)}`);
  }
  if (g.change_1h_m != null || g.change_3h_m != null) {
    items.push(`${fill("d_change", { c1: change(g.change_1h_m), c3: change(g.change_3h_m) })} · ${t("o_demo")}`);
  }
  if (g.tide) items.push(t("d_tide"));
  return `<details class="more"><summary>${esc(t("details"))}</summary><ul>${items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>`;
}
function dataRows(d) {
  const rows = [];
  for (const g of d.gauges) {
    rows.push(`<div class="row"><div class="top"><span><b>${esc(g.name)}</b> <span class="sub">(${esc(t(g.role === "upstream" ? "upstream" : "here"))})</span></span>` +
      `<span><b>${g.level_m} m</b> · ${esc(t("bands")[band(g)])}</span></div>${bar(g)}` +
      `${g.fresh ? "" : `<p class="stale">${esc(t("old").replace("{h}", hours(g.age_minutes)))}</p>`}` +
      `${origin(g)}${gaugeDetails(g)}</div>`);
  }
  const r = d.rain || {}, om = `<p class="origin">${esc(t("o_om"))}</p>`;
  const where = scene.rain_here_note ? scene.rain_here_note[lang] : r.here && r.here.name;
  if (r.here) rows.push(`<div class="row"><div class="top"><span><b>${esc(t("rain_here"))}</b> <span class="sub">(${esc(where)})</span></span>` +
    `<span>${esc(fill("rain_here_val", { m12: r.here.past_12h_mm ?? "-", m24: r.here.past_24h_mm ?? "-" }))}` +
    `${r.here.heavy ? " · " + esc(t("heavy")) : ""}</span></div>${om}</div>`);
  for (const u of r.upstream || []) rows.push(`<div class="row"><div class="top"><span><b>${esc(t("rain_up"))}</b> <span class="sub">(${esc(u.name)})</span></span>` +
    `<span>${esc(fill("rain_up_val", { m24: u.past_24h_mm ?? "-", m72: u.past_72h_mm ?? "-" }))}</span></div>${om}</div>`);
  if (!r.here && !(r.upstream || []).length) rows.push(`<div class="row"><p>${esc(t("no_rain"))}</p>${om}</div>`);
  const met = d.met_warnings || {};
  const metText = met.status === "skipped" ? (/archive/.test(met.note || "") ? t("met_skipped") : t("met_not_read")) : t("met_none");
  rows.push(`<div class="row"><div class="top"><b>${esc(t("met"))}</b><span>${esc(metText)}</span></div>` +
    `<p class="origin">${esc(t("o_gov"))}</p></div>`);
  return rows.join("");
}

// step 3: the expectations show at once; "–" until the run, then ✓ match / ✗ different from the REAL run output
function renderExpect() {
  $("s-expect").innerHTML = scene.expect.map((e) => {
    const row = checked && (checked.rows.find((x) => x.id === e.id) || { ok: false, said: { en: "-", ms: "-" } });
    const mark = !row ? `<span class="mark">${esc(t("pending"))}</span>`
      : `<span class="mark ${row.ok ? "ok" : "bad"}">${esc(t(row.ok ? "match" : "different"))}</span>`;
    return `<li><div><b>${esc(e.text[lang])}</b><p class="why">${esc(e.reason[lang])} ${esc(t("exp_source").replace("{s}", e.source[lang]))}</p>` +
      `${row && !row.ok ? `<p class="instead">${esc(row.said[lang])}</p>` : ""}</div>${mark}</li>`;
  }).join("");
}

// the plain "why", never cut mid-sentence - the same as app/scenes.py fit_why(): whole if it fits, else the whole
// sentences that fit + " …" (a sentence ends at . ! ? before a space or the end, not in "Kg. Salor" or "34.7")
const WHY_MAX = 400;
const SENTENCE_END = /(?<!\bKg)(?<!\bSg)(?<!\bKpg)(?<!\bJln)(?<!\bDr)(?<!\bSt)[.!?](?=\s|$)/g;
function fitWhy(text, limit = WHY_MAX) {
  if (text.length <= limit) return text;
  const ends = [...text.matchAll(SENTENCE_END)].map((m) => m.index + 1);
  const fit = ends.filter((e) => e + 2 <= limit);
  const end = fit.length ? fit[fit.length - 1] : (ends.length ? ends[0] : text.length);
  return text.slice(0, end) + (end < text.length ? " …" : "");
}

// the first 12 lines of a step - but always its LAST Critic review, which the trail reads (= app/scenes.py
// _keep_final_review, audit A-P2-19)
function keepFinalReview(lines, n = 12) {
  let out = lines.slice(0, n);
  const last = [...lines].reverse().find((l) => l.action === "critic.review");
  if (last && !out.includes(last)) out = [...out.slice(0, n - 1), last];
  return out;
}

// the parts of the run result the check needs - the same shape as app/scenes.py compact()
function compact(r) {
  const v = r.view || {}, how = r.how || {};
  const byLang = {};
  for (const l of ["en", "ms"]) {
    byLang[l] = ((v.sources || {})[l] || []).map((s) => ({ name: s.name, used: !!s.used, note: (s.note || "").slice(0, 80) }));
  }
  return { verdict: r.verdict,
    why: { en: fitWhy((v.why || {}).en || ""), ms: fitWhy((v.why || {}).ms || "") },
    sources: byLang.en.map((s) => ({ name: s.name, used: s.used })), sources_by_lang: byLang,
    steps: (how.rows || []).filter((x) => ["gather", "forecast", "critique", "safety"].includes(x.key)).map((x) => ({
      key: x.key, who: x.who, lines: keepFinalReview(x.lines || []).map((l) => ({ action: l.action, text: (l.text || "").slice(0, 160) })) })) };
}

async function start() {
  if (running) return;
  running = true; rawLines = [];
  $("start").disabled = true; $("start").textContent = t("running");
  $("status").textContent = t("running");
  const params = new URLSearchParams({ question: scene.data.question[lang], replay: scene.replay, at: scene.at, lang });
  let result = null, fresh = null;
  try {
    const res = await fetch("/run/stream?" + params);
    if (res.status === 429) throw new Error(t("busy"));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, cut); buf = buf.slice(cut + 2);
        const kind = (block.match(/^event: (.*)$/m) || [])[1];
        const data = JSON.parse((block.match(/^data: (.*)$/m) || [, "null"])[1]);
        if (kind === "step" && data && data.line) {
          rawLines.push(data.line.trim());                                       // raw: only in the technical log
          const stage = STAGE[data.line.replace(/^> /, "").trim()];
          if (stage) $("status").textContent = `${t("running")} ${t("stage")[stage]}`;
        }
        if (kind === "error") throw new Error((data && data.message) || "error");
        if (kind === "result") result = data;
      }
    }
    if (!result) throw new Error("no result");
    const c = await fetch(`/scenes/${scene.id}/check`, { method: "POST", headers: { "Content-Type": "application/json" },
                                                          body: JSON.stringify(compact(result)) });
    if (!c.ok) throw new Error("check HTTP " + c.status);
    fresh = await c.json();
    $("status").textContent = "";
  } catch (e) {
    $("status").textContent = t("failed").replace("{why}", e.message);
  } finally {
    running = false; $("start").disabled = false; $("start").textContent = t("start");
  }
  if (fresh) {
    checked = fresh;
    renderExpect(); renderCheck();
    $("start").hidden = true;
    // to the "N of M matched" line: smooth, or a jump when the reader asks for less motion (Cowork B-96)
    const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("r-score").scrollIntoView({ block: "start", behavior: still ? "auto" : "smooth" });
  }
}

function renderCheck() {
  $("result").hidden = false;
  // one feedback link per screen: in the public demo the last line's "Tell us" replaces the footer's Feedback (as on
  // the answer page); run locally there is no /feedback, so neither shows (Cowork audit P1-5)
  $("r-ask").hidden = !publicDemo;
  document.querySelectorAll('.vf-foot a[href="/feedback"]').forEach((a) => { a.hidden = true; });
  $("r-score").textContent = `${fill("score", { n: checked.matched, m: checked.total })} · ${fill("veda_said", { v: checked.verdict_name[lang] })}`;
  $("r-how").innerHTML = checked.how[lang].map((s) => `<li><b>${esc(s.who)}:</b> ${esc(s.text)}</li>`).join("");
  $("r-log").textContent = [...rawLines, "", ...checked.log.map((s) => `[${s.who}]\n  ${s.lines.join("\n  ")}`)].join("\n").trim();
}

function renderList() {
  $("list").hidden = false;
  const item = (s) => `<li><a href="/scenes/${esc(s.id)}?lang=${lang}"><span class="it"><b>${esc(s.town)} · ${esc(when(s.at))}</b>` +
    `<span class="sub">${esc(s.hook[lang])}</span></span><span class="chev" aria-hidden="true">›</span></a></li>`;
  $("list-real").innerHTML = all.scenes.filter((s) => s.data.kind === "replay").map(item).join("");
  $("list-made").innerHTML = all.scenes.filter((s) => s.data.kind !== "replay").map(item).join("");
}

$("start").addEventListener("click", start);
$("r-again").addEventListener("click", start);
$("r-logbox").addEventListener("toggle", () => { $("r-logsum").textContent = t($("r-logbox").open ? "hide_log" : "show_log"); });
function setLang(l) {                 // the frame's EN | BM switches this page in place (no reload)
  lang = l; store.set("veda.lang", lang);
  const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u);
  applyLang();
}
window.vedaSetLang = setLang;          // set before /frame.js runs, so the frame leaves the buttons to this page
document.querySelectorAll(".vf-lang [data-lang]").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
fetch("/scenes/data.json").then((r) => r.json()).then((d) => { all = d; applyLang(); });
fetch("/health").then((r) => r.json()).then((h) => { publicDemo = !!h.demo; if (checked) renderCheck(); })
  .catch(() => { /* no /health: stay as run locally (no feedback link) */ });
applyLang();
</script>
