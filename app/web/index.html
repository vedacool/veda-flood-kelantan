<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEDA - Kelantan flood check</title>
<link rel="icon" href="data:,">
<style>
  /* Cowork weekend plan B (24 Oct): EN and BM equal, no jargon, text >= 18 px, touch targets >= 44 px, works at 375 px.
     Plain HTML/CSS/JS, nothing loaded from outside. */
  :root { --bg: #f6f5f1; --fg: #1c1c1a; --muted: #55554f; --card: #ffffff; --line: #d6d5cf; --accent: #1f5f8b;
          --on-accent: #ffffff; --danger: #b3261e; --warn-text: #8a4a00;
          /* verdict colours differ in lightness too (relative luminance ACT 0.07 < NORMAL 0.15 < unknown 0.29 <
             PREPARE 0.40 < WATCH 0.68), each with text at >= 5.3:1 - accessibility pass 24 Oct */
          --v-normal: #257a43; --v-watch: #f6d548; --v-prepare: #f2933a; --v-act: #8f1d16; --v-unknown: #8e949b;
          --on-normal: #ffffff; --on-watch: #1c1c1a; --on-prepare: #1c1c1a; --on-act: #ffffff; --on-unknown: #1c1c1a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --fg: #eeeeea; --muted: #b0b0a9; --card: #212120; --line: #3b3b38; --accent: #82b8de;
            --on-accent: #151514; --danger: #f08a80; --warn-text: #f0b45a; }
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  html.big { font-size: 22px; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line);
           background: var(--card); position: sticky; top: 0; z-index: 2; }
  header .brand { font-weight: 800; font-size: 1.3rem; letter-spacing: .04em; margin-right: auto; background: none;
                  border: 0; color: var(--fg); padding: 0; min-height: 44px; cursor: pointer; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 1.45rem; line-height: 1.25; margin: 8px 0 16px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  button, .btn { font: inherit; min-height: 48px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line);
                 background: var(--card); color: var(--fg); cursor: pointer; text-decoration: none; display: inline-flex;
                 align-items: center; justify-content: center; gap: 8px; }
  button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
  .wide { width: 100%; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; min-width: 48px; padding: 8px 12px; font-weight: 700; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .towns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .towns button { min-height: 72px; font-weight: 700; font-size: 1.05rem; flex-direction: column; }
  .towns small { font-weight: 400; color: var(--muted); font-size: 1rem; }
  input, select { font: inherit; width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line);
                  border-radius: 12px; background: var(--card); color: var(--fg); }
  label { display: block; font-weight: 700; margin: 18px 0 6px; }
  .ask { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .note { color: var(--muted); margin: 8px 0 0; }
  .sos { margin-top: 22px; background: var(--danger); color: #fff; border-color: var(--danger); font-weight: 800; width: 100%;
         min-height: 56px; }
  @media (prefers-color-scheme: dark) { .sos { color: #151514; } }
  footer { margin-top: 28px; color: var(--muted); }
  footer p { margin: 0 0 8px; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
  .chip { display: inline-block; border: 2px dashed var(--muted); border-radius: 999px; padding: 2px 12px; font-weight: 700;
          color: var(--muted); }
  /* the replay moment (demo) */
  .intro { font-size: 1.05rem; margin: 0 0 12px; }
  .moment-label { font-weight: 700; margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .chips button { min-height: 44px; padding: 6px 12px; border-radius: 999px; font-size: 1rem; flex-direction: column;
                  line-height: 1.2; }
  .chips button small { font-size: 1rem; color: var(--muted); font-weight: 400; }
  .chips button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent);
                                       font-weight: 700; }
  .chips button[aria-pressed="true"] small { color: var(--on-accent); }
  .sheet { display: grid; gap: 8px; margin: -6px 0 14px; padding: 10px; border: 1px solid var(--line);
           border-radius: 14px; background: var(--card); }
  .sheet button { justify-content: flex-start; text-align: left; }
  .sheet button[aria-pressed="true"] { border: 2px solid var(--accent); font-weight: 700; }
  /* waiting */
  .checking { display: block; width: 100%; text-align: left; font-weight: 400; }
  .checking ul { list-style: none; padding: 0; margin: 0 0 6px; }
  .checking li { padding: 4px 0; font-size: 1.1rem; }
  .checking li.done::before { content: "✓ "; font-weight: 800; }
  .status { font-size: 1.15rem; font-weight: 700; min-height: 3em; }
  .bar { height: 14px; border-radius: 7px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; width: 3%; background: var(--accent); transition: width .6s ease; }
  .tip { border-left: 6px solid var(--accent); }
  .tip.warn { border-left-color: var(--v-prepare); }
  .linkish { background: none; border: 0; color: var(--accent); padding: 0 4px; min-height: 44px; min-width: 44px; font-weight: 700; }
  #log { list-style: none; padding: 0; margin: 8px 0 0; font: 1rem/1.4 ui-monospace, Consolas, monospace; }
  #log li { padding: 4px 0; border-bottom: 1px dashed var(--line); word-break: break-word; }
  /* answer */
  .place { font-size: 1.6rem; font-weight: 800; margin: 6px 0 8px; }
  .badge { display: flex; align-items: center; gap: 12px; border-radius: 14px; padding: 14px 16px; font-size: 1.4rem; font-weight: 800; }
  .badge svg { flex: none; width: 40px; height: 40px; }
  /* v2 verdict block (Cowork blueprint 24 Oct): word + "Level n of 4" + a growing 4-bar icon + one action line */
  .verdict { border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 48px 1fr; gap: 4px 14px;
             align-items: center; }
  .verdict svg { width: 48px; height: 48px; grid-row: span 2; }
  .verdict .word { font-size: 1.6rem; font-weight: 800; line-height: 1.15; }
  .verdict .lvl { font-weight: 700; }
  .verdict .act { grid-column: 1 / -1; margin: 8px 0 0; font-size: 1.15rem; font-weight: 700; }
  .verdict .act + .act { margin-top: 4px; }
  .v-NORMAL { background: #DDEBE3; color: #14232F; }
  .v-WATCH { background: #F6D46B; color: #14232F; }
  .v-PREPARE { background: #F0A04B; color: #14232F; }
  .v-ACT { background: #8E1F1A; color: #ffffff; }
  .v-INSUFFICIENT_DATA { background: #5B6470; color: #ffffff; }
  .big-steps { margin: 0 0 8px; padding-left: 1.6em; }
  .big-steps li { margin: 0 0 10px; font-size: 1.05rem; }
  #a-jps { margin-top: 10px; }
  /* home: one column of town rows */
  .town-list { display: grid; gap: 10px; }
  .town-list button { min-height: 64px; justify-content: space-between; text-align: left; width: 100%; }
  .town-list b { display: block; font-size: 1.1rem; }
  .town-list small { color: var(--muted); font-size: 1rem; }
  .town-list .go { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .sos.outline { background: var(--card); color: var(--danger); border: 2px solid var(--danger); }
  /* the river here: a gauge post */
  .river { display: grid; gap: 8px; }
  .river svg { width: 100%; max-width: 300px; height: auto; display: block; }
  .river-lines { list-style: none; padding: 0; margin: 0; }
  .river-lines li { padding: 4px 0; }
  .river-lines li:first-child { font-size: 1.3rem; font-weight: 800; }
  /* coming from upstream: hulu -> hilir */
  .flow { list-style: none; padding: 0; margin: 4px 0 6px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
          position: relative; }
  .flow li { text-align: center; position: relative; }
  .flow .dot { display: block; width: 26px; height: 26px; border-radius: 50%; margin: 0 auto 4px; border: 3px solid var(--fg); }
  .flow li:not(:last-child)::after { content: "→"; position: absolute; right: -10px; top: 0; font-weight: 800; }
  .flow .s-rain .dot { background: #1f5f8b; } .flow .s-high .dot { background: #F0A04B; }
  .flow .s-rising .dot { background: #F6D46B; } .flow .s-normal .dot { background: #DDEBE3; }
  .flow .s-none .dot { background: transparent; border-style: dashed; } .flow .s-you .dot { background: var(--fg); }
  .flow b { display: block; } .flow span { color: var(--muted); }
  .wa { background: #1B7F3B; color: #ffffff; border-color: #1B7F3B; font-weight: 800; grid-column: 1 / -1; min-height: 56px; }
  .oneline { font-size: 1.1rem; margin: 10px 0 4px; }
  .calm { font-weight: 700; margin: 4px 0 8px; }
  .combined { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--bg); font-weight: 600; }
  .todo h2 { text-transform: uppercase; letter-spacing: .03em; }
  .rows { display: grid; gap: 0; }
  .rows > div { display: grid; grid-template-columns: 6.5em 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .rows > div:last-child { border-bottom: 0; }
  .rows b { font-weight: 700; }
  .sub { color: var(--muted); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .strip { width: 100%; justify-content: space-between; text-align: left; font-weight: 600; }
  .levelbar { position: relative; height: 26px; border-radius: 8px; margin: 34px 0 8px;
              background: linear-gradient(90deg, var(--v-normal) 0 var(--a), var(--v-watch) var(--a) var(--w),
                                          var(--v-prepare) var(--w) var(--d), var(--v-act) var(--d) 100%); }
  .levelbar .mark { position: absolute; top: -30px; transform: translateX(-50%); font-weight: 800; white-space: nowrap; }
  .levelbar .needle { position: absolute; top: -6px; width: 4px; height: 38px; margin-left: -2px; background: var(--fg);
                      border-radius: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 0; padding: 0; list-style: none; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .sources { list-style: none; padding: 0; margin: 0; }
  .sources li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .sources li.out { color: var(--muted); }
  .share-text { white-space: pre-wrap; word-break: break-word; }
  .call { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .call a { min-height: 72px; font-size: 1.3rem; font-weight: 800; background: var(--danger); color: #fff; border-color: var(--danger); }
  @media (prefers-color-scheme: dark) { .call a { color: #151514; } }
  .how { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .how li { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .how .head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .how .head b { font-size: 1.05rem; }
  .how .secs { margin-left: auto; font-family: ui-monospace, Consolas, monospace; }
  .how p { margin: 6px 0 0; word-break: break-word; }
  .how .ai { font-weight: 700; }
  .how .warn { color: var(--warn-text); font-weight: 700; }
  .steps { padding-left: 1.4em; }
  .steps li { margin: 0 0 10px; }
  @media (max-width: 400px) { .rows > div { grid-template-columns: 1fr; gap: 2px; } }
</style>
</head>
<body>
<header>
  <button class="brand" type="button" id="home-link" aria-label="VEDA">VEDA</button>
  <div class="seg" role="group" aria-label="Language / Bahasa">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="ms" aria-pressed="false">BM</button>
  </div>
  <button type="button" id="aa" aria-pressed="false" data-t-label="bigger">Aa</button>
</header>
<main>

<!-- 1. Home -->
<section id="s-home">
  <h1 data-t="home_title"></h1>
  <!-- Cowork 24 Oct (demo UI round): in the demo, the moment of the replay is visible and easy to change -->
  <div id="moment" hidden>
    <p class="intro" id="intro"></p>
    <p class="intro sub" id="start-rp" data-t="start_rp"></p>
    <p class="moment-label" id="moment-label" data-t="change_moment"></p>
    <div class="chips" id="chips" role="group" aria-labelledby="moment-label"></div>
    <div class="sheet" id="scenes" hidden></div>
  </div>
  <div class="town-list" id="towns"></div>
  <form id="ask">
    <label for="q" data-t="or_type"></label>
    <div class="ask">
      <input id="q" maxlength="500" required aria-describedby="privacy-line">
      <button class="primary" type="submit" data-t="ask"></button>
    </div>
    <p id="privacy-line" class="note"><span data-t="privacy_short"></span>
      <button class="linkish" type="button" id="priv-more" aria-expanded="false" aria-controls="privacy" data-t="more"></button></p>
    <p id="privacy" class="note" data-t="privacy" hidden></p>
  </form>
  <button class="sos outline" type="button" id="sos" data-t="sos"></button>
  <footer>
    <p data-t="footer"></p>
    <p data-t="credits_lead"></p>
    <p><a href="https://publicinfobanjir.water.gov.my/">JPS Infobanjir</a> ·
       <a href="https://data.gov.my/">data.gov.my</a> (MetMalaysia) ·
       <a href="https://open-meteo.com/">Open-Meteo</a> (<a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>) ·
       © OpenStreetMap contributors (ODbL)</p>
    <p data-t="credits_replay"></p>
    <select id="mode" hidden aria-hidden="true" tabindex="-1"></select><!-- the chosen data; set by the moment chips -->
  </footer>
</section>

<!-- 2. Waiting -->
<section id="s-wait" hidden>
  <p class="place" id="w-place"></p>
  <p class="status" id="w-status" role="status" aria-live="polite"></p>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="w-bar-box"><div id="w-bar"></div></div>
  <div class="card tip" id="w-tip"></div>
  <!-- Cowork 24 Oct: a short "checking" step - the run's real steps in plain words, 2-4 s, tap to skip -->
  <button type="button" class="card checking" id="w-check" hidden aria-describedby="w-skip-note">
    <ul id="w-check-list"></ul><span class="sub" id="w-skip-note" data-t="tap_skip"></span></button>
  <button class="linkish" type="button" id="w-more" aria-expanded="false" data-t="see_doing"></button>
  <ol id="log" hidden></ol>
</section>

<!-- 3. Answer -->
<section id="s-answer" hidden>
  <p id="a-label" hidden><span class="chip" id="a-label-text"></span>
    <button type="button" class="linkish" id="a-change" data-t="change" hidden></button></p>
  <p class="place" id="a-place"></p>
  <!-- v2 (Cowork blueprint 24 Oct): level word + "Level n of 4" + ONE action line; never colour alone -->
  <div class="verdict" id="a-badge" role="group"></div>
  <p class="oneline sub" id="a-line"></p>
  <div class="card todo"><h2 data-t="todo"></h2><ol class="steps big-steps" id="a-steps"></ol>
    <p id="a-todo" class="sub" style="margin:0"></p>
    <a class="btn wide" id="a-jps" href="https://publicinfobanjir.water.gov.my/" target="_blank" rel="noopener"
       data-t="open_jps" hidden></a></div>
  <button type="button" class="sos" id="a-sos" data-t="sos" hidden></button>
  <div id="a-rows">
    <div class="card" id="a-river-box"><h2 data-t="river_here"></h2><div class="river"><div id="a-post"></div>
      <ul class="river-lines" id="a-river-lines"></ul></div></div>
    <div class="card" id="a-flow-box"><h2 data-t="from_upstream"></h2><ol class="flow" id="a-flow"></ol>
      <p class="sub" id="a-flow-caption"></p><div id="a-up-text"></div></div>
    <div class="card" id="a-rain-box2"><h2 data-t="rain"></h2><div id="a-rain-text"></div></div>
  </div>
  <div class="actions">
    <a class="btn wa wide" id="a-wa" target="_blank" rel="noopener" data-t="send_family"></a>
    <button type="button" id="a-listen" data-t="listen"></button>
    <button type="button" id="a-check" data-t="check_again"></button>
  </div>
  <button type="button" class="linkish" id="a-share" data-t="see_text"></button>
  <button type="button" class="strip" id="a-strip" aria-expanded="false" aria-controls="a-details"></button>
  <div id="a-details" hidden>
    <div class="card"><h2 data-t="why"></h2><p id="a-why" style="margin:0"></p>
      <p id="a-combined" class="combined" hidden></p>
      <div id="a-bar-box"></div></div>
    <div class="card" id="a-expl-box" hidden><h2 data-t="explained"></h2><p id="a-expl" style="margin:0"></p>
      <p class="note" data-t="expl_note"></p></div>
    <div class="card" id="a-water-box"><h2 data-t="water_detail"></h2><ul class="sources" id="a-water"></ul></div>
    <div class="card" id="a-rain-box"><h2 data-t="rain_detail"></h2><ul class="sources" id="a-rain"></ul></div>
    <div class="card"><h2 data-t="sources"></h2><ul class="sources" id="a-sources"></ul></div>
    <button class="linkish" type="button" id="a-how" data-t="how_link"></button>
  </div>
  <div class="card" id="a-plain" hidden><p class="share-text" id="a-plain-text" style="margin:0"></p>
    <div class="towns" id="a-choices" style="margin-top:12px"></div></div>
  <button type="button" class="wide" id="a-again" data-t="again" style="margin-top:12px"></button>
  <p class="note" data-t="disclaimer"></p>
</section>

<!-- 7. How VEDA worked this out (from the run's trace; never the question) -->
<section id="s-how" hidden>
  <h1 data-t="how_title"></h1>
  <p class="note" id="h-total"></p>
  <ol class="how" id="h-rows"></ol>
  <p class="note" data-t="how_note"></p>
  <a class="btn wide" id="h-live" data-t="how_live"></a>
  <p></p>
  <button type="button" class="wide" id="h-back" data-t="back"></button>
</section>

<!-- 4. Share -->
<section id="s-share" hidden>
  <h1 data-t="share_title"></h1>
  <div class="card"><p class="share-text" id="sh-text" style="margin:0"></p></div>
  <a class="btn primary wide" id="sh-wa" target="_blank" rel="noopener" data-t="send_wa"></a>
  <p></p>
  <button type="button" class="wide" id="sh-copy" data-t="copy"></button>
  <p class="note" id="sh-copied" role="status" aria-live="polite"></p>
  <p class="note" data-t="share_note"></p>
  <button type="button" class="wide" id="sh-back" data-t="back"></button>
</section>

<!-- 5. Emergency (no engine call) -->
<section id="s-sos" hidden>
  <h1 id="e-title" data-t="sos_title"></h1>
  <div class="call">
    <a class="btn" href="tel:999" data-t="call999"></a>
    <a class="btn" href="tel:991" data-t="call991"></a>
  </div>
  <div class="card"><ol class="steps" id="e-steps"></ol></div>
  <p class="note" data-t="disclaimer"></p>
  <button type="button" class="wide" id="e-back" data-t="back"></button>
</section>

<p id="err" class="card" role="alert" hidden></p>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const UI = {
  en: {
    home_title: "Is my area at risk of flooding?", or_type: "Or type a question", ask: "Ask",
    privacy: "Please don't type names, IC, phone numbers or addresses. Your question is not sent to any AI model; it stays on this computer in VEDA's log files, with phone and IC numbers masked.",
    sos: "I'm stranded / in danger", 
    privacy_short: "Your question stays private ·", more: "more ›", less: "less ‹",
    water_detail: "Water in detail",
    footer: "Not an official warning. Follow JPS / APM / police instructions. Emergency 999 · APM 991.",
    credits_lead: "River levels: Jabatan Pengairan dan Saliran (JPS) Malaysia, read live on this machine and used for non-commercial public-safety research. Also:",
    credits_replay: "Past flood replay (Nov 2024): readings as reported by Bernama and Kosmo, citing JPS. Made-up test scenes use invented readings.",
    see_doing: "See what VEDA is doing ›", hide_doing: "Hide what VEDA is doing",
    todo: "What to do now", water: "Water", upstream: "Upstream", rain: "Rain",
    share: "Share with family", listen: "Listen", stop: "Stop", details: "Details ›", hide_details: "Hide details",
    why: "Why", explained: "In plain words", expl_note: "Written by AI (Nemotron) from the checked facts, then checked again.",
    sources: "Where this comes from", again: "Ask another question",
    disclaimer: "Not an official warning. Follow JPS / APM / police instructions. Emergency 999 · APM 991.",
    share_title: "Share with family", send_wa: "Send on WhatsApp", copy: "Copy text", copied: "Copied.",
    share_note: "Only the answer is shared - never your question.", back: "Back",
    sos_title: "If you are stranded or in danger", call999: "Call 999", call991: "Call APM 991",
    bigger: "Bigger text", tip_label: "Tip", warn_label: "MetMalaysia warning",

  const hi = Math.max(b.level_m, b.danger_m) + (b.danger_m - b.alert_m) * 0.4;
  const pos = (v) => Math.max(0, Math.min(100, ((v - lo) / (hi - lo)) * 100));
  const w = b.warning_m != null ? b.warning_m : (b.alert_m + b.danger_m) / 2;
  const style = `--a:${pos(b.alert_m)}%;--w:${pos(w)}%;--d:${pos(b.danger_m)}%`;
  const p = pos(b.level_m);
  const shift = p > 75 ? "-100%" : p < 25 ? "0" : "-50%";          // keep the label inside the bar
  const item = (v, key, colour) => `<li><i style="background:var(${colour})"></i>${esc(t(key))} ${v} ${t("m")}</li>`;
  return `<div class="levelbar" style="${style}" role="img" aria-label="${esc(t("level_now"))} ${b.level_m} ${t("m")}; ${esc(t("alert"))} ${b.alert_m}; ${esc(t("danger"))} ${b.danger_m}">` +
    `<span class="mark" style="left:${p}%;transform:translateX(${shift})">${esc(t("level_now"))} ${b.level_m} ${t("m")}</span><span class="needle" style="left:${p}%"></span></div>` +
    `<ul class="legend">${item(b.alert_m, "alert", "--v-watch")}` +
    (b.warning_m != null ? item(b.warning_m, "warning", "--v-prepare") : "") + item(b.danger_m, "danger", "--v-act") + `</ul>`;
}
// v2 (Cowork blueprint 24 Oct): a growing 4-bar icon, filled up to the level; "?" when VEDA can't confirm
function levelIcon(n) {
  if (!n) return `<svg viewBox="0 0 40 40" aria-hidden="true">${ICON.INSUFFICIENT_DATA}</svg>`;
  return `<svg viewBox="0 0 44 40" aria-hidden="true">` + [0, 1, 2, 3].map((i) => {
    const h = 10 + i * 9, x = 2 + i * 11;
    return `<rect x="${x}" y="${38 - h}" width="8" height="${h}" rx="1.5" fill="${i < n ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"/>`;
  }).join("") + `</svg>`;
}
// "The river here": a gauge post - JPS bands from the gauge's own thresholds, the Dec 2014 line only when known
function gaugePost(r) {
  const W = 260, H = 250, top = 12, span = H - 24;
  const marks = [r.normal_m, r.alert_m, r.warning_m, r.danger_m].filter((x) => x != null);
  const step = (r.danger_m - (r.alert_m != null ? r.alert_m : r.danger_m - 1)) || 1;
  const lo = Math.min(r.level_m, ...marks) - step * [JPS reading];
  const hi = Math.max(r.level_m, r.danger_m, r.y2014_m != null ? r.y2014_m : -Infinity) + step * 0.6;
  const y = (v) => top + ((hi - v) / (hi - lo)) * span;
  const x0 = 78, x1 = 104;                                   // the post
  const band = (a, b, colour) => (a == null || b == null) ? "" :
    `<rect x="${x0}" y="${y(b)}" width="${x1 - x0}" height="${Math.max(0, y(a) - y(b))}" fill="${colour}"/>`;
  const line = (v, label, dashed) => v == null ? "" :
    `<line x1="${x0 - 4}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" stroke-width="2"${dashed ? ' stroke-dasharray="6 5"' : ""}/>` +
    `<text x="${x1 + 8}" y="${y(v) - 5}" font-size="18" fill="currentColor">${esc(label)}</text>`;
  const m = (v) => `${v} ${t("m")}`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(t("level_now"))} ${m(r.level_m)}; ${esc(t("danger"))} ${m(r.danger_m)}">` +
    `<rect x="${x0}" y="${top}" width="${x1 - x0}" height="${span}" fill="var(--card)" stroke="currentColor" stroke-width="2"/>` +
    band(r.normal_m, r.alert_m, "#DDEBE3") + band(r.alert_m, r.warning_m != null ? r.warning_m : r.danger_m, "#F6D46B") +
    band(r.warning_m, r.danger_m, "#F0A04B") + band(r.danger_m, hi, "#8E1F1A") +
    line(r.normal_m, `${t("normal")} ${m(r.normal_m)}`) + line(r.alert_m, `${t("alert")} ${m(r.alert_m)}`) +
    line(r.warning_m, `${t("warning")} ${m(r.warning_m)}`) + line(r.danger_m, `${t("danger")} ${m(r.danger_m)}`) +
    (r.y2014_m != null ? line(r.y2014_m, t("y2014"), true) : "") +
    `<text x="${x0 - 6}" y="${y(r.level_m) + 6}" font-size="18" font-weight="800" text-anchor="end" fill="currentColor">${esc(t("level_now"))} ▶</text>` +
    `<line x1="${x0 - 2}" x2="${x1 + 2}" y1="${y(r.level_m)}" y2="${y(r.level_m)}" stroke="currentColor" stroke-width="5"/></svg>`;
}
function placeLink() {      // "Check it yourself": this place at this moment - never the question
  const v = result && result.view;
  const q = new URLSearchParams({ place: (v && v.place) || "", lang });
  const [replay, at] = (askedMode || "|").split("|");
  if (replay) { q.set("replay", replay); q.set("at", at); }
  return `${location.origin}/?${q}`;
}
function shareFull() {
  const v = result && result.view;
  if (!v) return result ? result.output : "";
  return `${v.share[lang]}\n${t("check_yourself")} ${placeLink()}`;
}
function renderAnswer() {
  const v = result && result.view;
  $("a-plain").hidden = !!v;
  ["a-badge", "a-rows", "a-strip", "a-share"].forEach((id) => { $(id).hidden = !v; });
  document.querySelector("#s-answer .todo").hidden = !v;
  document.querySelector("#s-answer .actions").hidden = !v;
  $("a-line").hidden = !v;
  $("a-sos").hidden = !(v && v.verdict === "INSUFFICIENT_DATA");
  if (!v) {  // no place card: not covered (nearest place), did you mean, or VEDA's data cannot be reached
    const o = result && result.other;
    $("a-label").hidden = true; $("a-place").textContent = ""; $("a-details").hidden = true;
    $("a-plain-text").textContent = o ? o.text[lang] : (result ? result.output : "");
    const towns = o && o.kind === "not_covered" && o.nearest ? [o.nearest] : o && o.kind === "did_you_mean" ? o.suggestions : [];
    $("a-choices").replaceChildren(...towns.map((town) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "primary";
      b.textContent = t("check_town").replace("{town}", town);
      b.addEventListener("click", () => ask(UI[lang].q_default.replace("{town}", town), town));
      return b;
    }));
    $("a-sos").hidden = !(o && o.kind === "down");
    return;
  }
  $("a-combined").hidden = !v.combined;
  if (v.combined) $("a-combined").textContent = v.combined[lang];
  $("a-label").hidden = !v.label;
  const moment = v.label && momentLabel();      // Cowork 24 Oct: "Replay · 27 Nov 2024, 7:30 pm · Change"
  if (v.label) $("a-label-text").textContent = moment || v.label[lang];
  $("a-change").hidden = !moment || $("moment").hidden;
  $("a-place").textContent = v.place || "";
  $("a-badge").className = "verdict v-" + v.verdict;
  $("a-badge").setAttribute("aria-label", `${v.headline[lang]}. ${v.level_text[lang]}`);
  $("a-badge").innerHTML = levelIcon(v.level) + `<span class="word">${esc(v.headline[lang])}</span>` +
    `<span class="lvl">${esc(v.level_text[lang])}</span>` + v.action[lang].map((a) => `<p class="act">${esc(a)}</p>`).join("");
  // the reason line, only when something other than this town's river set the verdict (rain, upstream, a warning)
  $("a-line").hidden = v.line_is_river || v.verdict === "INSUFFICIENT_DATA";
  $("a-line").textContent = v.line[lang];
  $("a-steps").innerHTML = v.steps[lang].map((s) => `<li>${escBm(s)}</li>`).join("");
  const more = (v.todo_more && v.todo_more[lang]) || [];          // tide / thunderstorm advice
  $("a-todo").hidden = !more.length;
  $("a-todo").innerHTML = escBm(more.join(" "));
  $("a-jps").hidden = !v.official_link;
  $("a-river-box").hidden = !v.river;                                 // no river reading -> no post
  if (v.river) {
    $("a-post").innerHTML = gaugePost(v.river[lang]);
    $("a-river-lines").innerHTML = v.river[lang].lines.map((x) => `<li>${esc(x)}</li>`).join("");
  }
  const f = v.flow && v.flow[lang], up = v.upstream[lang];
  $("a-flow-box").hidden = !f && !up.length;
  $("a-flow").hidden = !f; $("a-flow-caption").hidden = !f;
  if (f) {
    $("a-flow").innerHTML = f.dots.map((d) => `<li class="s-${d.state}"><span class="dot"></span><b>${esc(d.name)}</b><span>${esc(d.text)}</span></li>`).join("");
    $("a-flow-caption").textContent = f.caption;
  }
  $("a-up-text").innerHTML = up.map((x, i) => `<p${i ? ' class="sub"' : ""}>${esc(x)}</p>`).join("");
  const rmore = (v.rain_more && v.rain_more[lang]) || [];     // small rivers, until when, Thailand not checked
  $("a-rain-text").innerHTML = `<p>${esc(v.rain ? v.rain[lang] : (rmore[0] || t("no_rain")))}</p>` +
    (v.rain ? rmore : rmore.slice(1)).map((x) => `<p class="sub">${esc(x)}</p>`).join("");
  $("a-wa").href = "https://wa.me/?text=" + encodeURIComponent(shareFull());
  $("a-water-box").hidden = !v.water;
  if (v.water) $("a-water").innerHTML = v.water[lang].detail.map((x) => `<li>${esc(x)}</li>`).join("");
  const rainDetail = (v.rain_detail && v.rain_detail[lang]) || [];     // the numbers behind the plain rows
  $("a-rain-box").hidden = !rainDetail.length;
  $("a-rain").innerHTML = rainDetail.map((x) => `<li>${esc(x)}</li>`).join("");
  const open = !$("a-details").hidden;
  $("a-strip").innerHTML = `<span>${esc(v.strip[lang])}</span><span>${esc(open ? t("hide_details") : t("details"))}</span>`;
  $("a-why").textContent = v.why[lang];
  $("a-bar-box").innerHTML = levelBar(v.level_bar);
  $("a-how").hidden = !result.how;
  $("a-expl-box").hidden = !v.explanation;
  if (v.explanation) { $("a-expl").textContent = v.explanation.text; $("a-expl").lang = v.explanation.language || ""; }
  $("a-sources").innerHTML = v.sources[lang].map((s) =>
    `<li class="${s.used ? "" : "out"}">${s.used ? "✓" : "–"} ${esc(s.name)} <span class="sub">(${esc(s.note)})</span></li>`).join("");
}

// ---------- 7. How VEDA worked this out ----------
function renderHow() {
  const h = result && result.how;
  if (!h) return;
  $("h-total").textContent = h.total_s != null ? t("total").replace("{s}", h.total_s) : "";
  $("h-rows").innerHTML = h.rows.map((r) => {
    const ai = r.ai.map((a) => a.status === "success"
      ? `<p class="ai">${esc(t("answered").replace("{m}", a.model || "?"))} · ${esc(t("receipt"))} ${esc(a.receipt || "-")} · ${a.seconds} s</p>`
      : `<p class="warn">${esc(t("ai_failed"))} (${esc(a.agent)}): ${esc(a.note || a.status)} · ${a.seconds} s</p>`).join("");
    const aiStep = ["draft", "critique", "revise"].includes(r.key);
    return `<li><div class="head"><b>${esc(r.name[lang])}</b><span class="sub">${esc(r.who)}</span>` +
      `<span class="secs">${r.seconds != null ? r.seconds + " s" : ""}</span></div>` +
      (r.queries ? `<p class="sub">${esc(t("queries").replace("{n}", r.queries))}</p>` : "") +
      r.lines.map((l) => `<p lang="en"${l.status === "fallback" ? ' class="warn"' : ""}>${esc(l.text)}</p>`).join("") +
      (ai || (aiStep ? "" : `<p class="sub">${esc(t("code_only"))}</p>`)) + `</li>`;
  }).join("") + (h.fallbacks && h.fallbacks.length
    ? `<li><p class="warn">${esc(t("fallbacks"))}: ${esc(h.fallbacks.join("; "))}</p></li>` : "");
  $("h-live").href = "/live?run=" + encodeURIComponent(result.run_id);
}

// ---------- 4. Share ----------
function renderShare() {
  const text = shareFull();
  $("sh-text").textContent = text;
  $("sh-wa").href = "https://wa.me/?text=" + encodeURIComponent(text);
  $("sh-copied").textContent = "";
}

// ---------- 5. Emergency ----------
function renderSos() {
  $("e-steps").replaceChildren(...words.emergency.steps[lang].map((s) => { const li = document.createElement("li"); li.textContent = s; return li; }));
}

// ---------- Listen (the browser's own voice; nothing leaves the device) ----------
function stopSpeaking() { if (window.speechSynthesis) speechSynthesis.cancel(); speaking = false; $("a-listen").textContent = t("listen"); }
function listen() {
  if (!window.speechSynthesis || !result || !result.view) return;
  if (speaking) { stopSpeaking(); return; }
  const v = result.view;
  const text = [v.place, v.headline[lang], v.level_text[lang], v.action[lang].join(" "),
                t("todo") + ": " + v.steps[lang].join(" ")].join(". ");
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === "ms" ? "ms-MY" : "en-GB";
  const voice = speechSynthesis.getVoices().find((x) => x.lang && x.lang.toLowerCase().startsWith(lang === "ms" ? "ms" : "en"));
  if (voice) u.voice = voice;
  u.onend = () => stopSpeaking();
  speaking = true; $("a-listen").textContent = t("stop");
  speechSynthesis.speak(u);
}

// ---------- wiring ----------
document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
$("aa").addEventListener("click", () => {
  const big = !document.documentElement.classList.contains("big");
  document.documentElement.classList.toggle("big", big);
  $("aa").setAttribute("aria-pressed", String(big));
  store.set("veda.big", big ? "1" : "0");
});
$("home-link").addEventListener("click", () => { stopSpeaking(); show("s-home"); });
$("ask").addEventListener("submit", (ev) => { ev.preventDefault(); if ($("q").value.trim()) ask($("q").value.trim(), ""); });
$("sos").addEventListener("click", () => show("s-sos"));
function toggle(btn, box, open, closed) {
  box.hidden = !box.hidden;
  btn.setAttribute("aria-expanded", String(!box.hidden));
  btn.textContent = t(box.hidden ? closed : open);
}
$("priv-more").addEventListener("click", () => toggle($("priv-more"), $("privacy"), "less", "more"));
$("a-change").addEventListener("click", () => {
  stopSpeaking(); show("s-home");
  const pastNow = (DATA.find((d) => d.v === $("mode").value) || {}).k === "past";
  $("scenes").hidden = pastNow;                          // a test scene was chosen: show the scene list open
  renderMoment();
  $("moment").scrollIntoView();
  const pressed = document.querySelector("#chips [aria-pressed='true'], #scenes [aria-pressed='true']");
  if (pressed) pressed.focus();
});
$("w-check").addEventListener("click", () => { if (skipCheck) skipCheck(); });
$("e-back").addEventListener("click", () => show("s-home"));
$("w-more").addEventListener("click", () => {
  $("log").hidden = !$("log").hidden;
  $("w-more").setAttribute("aria-expanded", String(!$("log").hidden));
  $("w-more").textContent = $("log").hidden ? t("see_doing") : t("hide_doing");
});
$("a-strip").addEventListener("click", () => {
  $("a-details").hidden = !$("a-details").hidden;
  $("a-strip").setAttribute("aria-expanded", String(!$("a-details").hidden));
  renderAnswer();
});
$("a-share").addEventListener("click", () => { stopSpeaking(); renderShare(); show("s-share"); });
$("a-listen").addEventListener("click", listen);
$("a-check").addEventListener("click", () => { stopSpeaking(); ask(lastQuestion, (result && result.view && result.view.place) || ""); });
$("a-sos").addEventListener("click", () => { stopSpeaking(); show("s-sos"); });
$("a-how").addEventListener("click", () => { stopSpeaking(); renderHow(); show("s-how"); });
$("h-back").addEventListener("click", () => show("s-answer"));
$("a-again").addEventListener("click", () => { stopSpeaking(); show("s-home"); });
$("sh-back").addEventListener("click", () => show("s-answer"));
$("sh-copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("sh-text").textContent); $("sh-copied").textContent = t("copied"); }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents($("sh-text"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
});

// start: language from the saved choice, else the browser (ms -> BM); URL ?lang= / ?replay=&at= for demos
const params = new URLSearchParams(location.search);
lang = params.get("lang") || store.get("veda.lang") || ((navigator.language || "").toLowerCase().startsWith("ms") ? "ms" : "en");
if (!UI[lang]) lang = "en";
if (store.get("veda.big") === "1") { document.documentElement.classList.add("big"); $("aa").setAttribute("aria-pressed", "true"); }
applyLang();
// ?replay=&at= is applied at once - not after /health, which can take seconds live (24 Oct: a tap before it answered
// ran on live data although the link asked for a past flood); applyLang keeps the choice when /health re-renders it
const want = params.get("replay") ? `${params.get("replay")}|${params.get("at") || ""}` : null;
if (want && [...$("mode").options].some((o) => o.value === want)) $("mode").value = want;
// Cowork 24 Oct: the moment chips are for demos only - ?demo=1, a ?replay= link, or offline (SAMPLE_MODE)
const demo = () => { $("moment").hidden = !(params.get("demo") === "1" || want || sampleMode); renderMoment(); };
demo();
fetch("/ui/words").then((r) => r.json()).then((w) => { words = w; renderSos(); }).catch(() => {});
// a tap waits for /health (offline it answers at once): the demo's first answer is then on the chosen moment
const ready = fetch("/health").then((r) => r.json()).then((h) => {
  sampleMode = !!h.sample_mode;
  // Cowork 24 Oct: the offline demo opens on the Nov 2024 flood at its peak, not on a made-up calm day
  if (sampleMode && !want) $("mode").value = PEAK;
  applyLang();
  demo();
}).catch(() => {});
// "Check it yourself" links (v2 share text): ?place=<town> asks about that town at once (with ?replay=&at=)
if (TOWNS.includes(params.get("place"))) {
  const town = params.get("place");
  ready.then(() => ask(UI[lang].q_default.replace("{town}", town), town));
}
