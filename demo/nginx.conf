# VEDA public demo - the one public entry point (docs/DEPLOY_DEMO.md). Plain nginx: per-visitor rate limit,
# security headers, /admin and run logs closed, /feedback to the feedback service. The demo strip, top bar and
# footer come from the app itself (B-96 shared frame, app/frame.py).
# No access log and only critical errors: nginx's normal logs would store visitors' IP addresses.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    access_log off;
    server_tokens off;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    types { text/html html; text/plain txt; application/json json; application/javascript js; }

    # Tailscale Funnel connects from this machine and passes the visitor's address in X-Forwarded-For. The LAST
    # entry is the one the Funnel added (a visitor can only prepend made-up entries). Check on the Wyse that the
    # limit cannot be dodged by sending a fake header (docs/DEPLOY_DEMO.md, step 6).
    map $http_x_forwarded_for $visitor {
        "~(?<last>[^,\s]+)\s*$" $last;
        default                 $remote_addr;
    }
    # Two limits per visitor: 20 answers (and feedback requests) a minute - the costly part; 120 page requests a
    # minute - one answer alone loads about 4 (page, words, health, steps), so a flat 20 would cut off normal use.
    limit_req_zone $visitor zone=answers:10m rate=20r/m;
    limit_req_zone $visitor zone=pages:10m rate=120r/m;
    limit_req_status 429;
    # Open streams (the answer's steps, the live log) hold a connection each: at most 3 per visitor and 10 in all,
    # so nobody can tie up VEDA by opening many and leaving them open (audit 24 Oct).
    limit_conn_zone $visitor zone=streams_per_visitor:10m;
    map $host $everyone { default "all"; }          # one key for all visitors (an empty key would not be counted)
    limit_conn_zone $everyone zone=streams_all:1m;
    # The live log has zones of its own (audit 26 Oct, A-P2-12): it stays open for good, so 10 open live logs must
    # never use up the slots that questions (/run/stream, /api/v1/) need. Same numbers: 3 per visitor, 10 in all.
    limit_conn_zone $visitor zone=live_per_visitor:10m;
    limit_conn_zone $everyone zone=live_all:1m;
    limit_conn_status 429;

    upstream veda     { server veda:8000; }
    upstream feedback { server feedback:8090; }

    server {
        listen 8080;
        limit_req zone=pages burst=60 nodelay;

        # Same rules as VEDA's own page: no external scripts, styles or connections; no framing.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;     # the public address is HTTPS only

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Visitors' addresses and identities stop here: VEDA and the feedback service never receive them.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Tailscale-User-Login "";
        proxy_set_header Tailscale-User-Name "";
        proxy_set_header Tailscale-User-Profile-Pic "";

        # Operator screens and per-run logs: never public (behind a tunnel every visitor could look local).
        location ^~ /admin      { return 404; }
        location ^~ /trace/run/ {               # JSON, so the live log shows this sentence instead of an error
            default_type application/json;
            return 404 '{"error": {"code": "not_in_demo", "message": "This run\'s step log is not shown in the public demo. Choose a recorded live run above to replay one."}}';
        }

        location ^~ /feedback {
            limit_req zone=pages burst=60 nodelay;
            limit_req zone=answers burst=10 nodelay;
            proxy_pass http://feedback;
            # Audit A-P3-30: the feedback service caps answers per visitor. It gets the rate-limit key in ONE internal
            # header, hashes it at once with a salt held in memory only and never stores or logs it. A location that
            # sets any proxy_set_header inherits none from the server block, so the server's lines are repeated here.
            proxy_set_header X-Veda-Visitor $visitor;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header Tailscale-User-Login "";
            proxy_set_header Tailscale-User-Name "";
            proxy_set_header Tailscale-User-Profile-Pic "";
        }

        # Asking a question: both limits.
        location = /run {
            limit_req zone=pages burst=60 nodelay;
            limit_req zone=answers burst=10 nodelay;
            proxy_pass http://veda;
        }

        # VEDA's pages go through unchanged (location / below): the demo strip, top bar, footer and the answer's own
        # feedback line come from the app (B-96 shared frame) - nothing is added here, or it would show twice.

        # Streams: the answer's steps and the live log, unbuffered.
        location = /run/stream {
            limit_conn streams_per_visitor 3;
            limit_conn streams_all 10;
            limit_req zone=pages burst=60 nodelay;
            limit_req zone=answers burst=10 nodelay;
            proxy_pass http://veda;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
        location = /live/stream {
            limit_conn live_per_visitor 3;
            limit_conn live_all 10;
            proxy_pass http://veda;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # The public API (B-92: /api/v1/ask runs the same agents as the page) and its docs page: the same per-visitor
        # limits as /run/stream - both request rates, at most 3 open requests per visitor and 10 in all.
        location ^~ /api/v1/ {
            limit_conn streams_per_visitor 3;
            limit_conn streams_all 10;
            limit_req zone=pages burst=60 nodelay;
            limit_req zone=answers burst=10 nodelay;
            proxy_pass http://veda;
            proxy_read_timeout 300s;
        }
        location = /api/docs {
            limit_conn streams_per_visitor 3;
            limit_conn streams_all 10;
            limit_req zone=pages burst=60 nodelay;
            limit_req zone=answers burst=10 nodelay;
            proxy_pass http://veda;
            # Swagger UI's script and style come from jsDelivr: the app sends this page's own CSP (app/api.py,
            # DOCS_CSP); the server-wide CSP above is not added here (a second, stricter one would block the page).
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }
        # FastAPI's own docs and schema are not part of the public demo (the app closes them too, VEDA_DEMO=1)
        location = /docs         { return 404; }
        location = /redoc        { return 404; }
        location = /openapi.json { return 404; }

        location / { proxy_pass http://veda; }
    }
}
