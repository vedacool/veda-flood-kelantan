# VEDA public OFFLINE demo (docs/DEPLOY_DEMO.md). From the repo folder:
#   docker compose -f demo/compose.yaml --profile demo up -d --build
#   docker compose -f demo/compose.yaml --profile demo down          # stop (the feedback volume is kept)
# Only the proxy has a published port, on 127.0.0.1 only; Tailscale Funnel points at it. VEDA and the feedback
# service sit on an internal network with no route out: offline by construction, whatever the code does.
name: veda-demo

services:
  veda:
    profiles: [demo]
    build: { context: .., dockerfile: Dockerfile }
    image: veda:demo
    environment:
      SAMPLE_MODE: "true"            # offline scenes only; no .env, no keys are given to this container
      VEDA_DEMO: "1"                 # public demo mode in the app itself, once Session A's change lands (DEPLOY_DEMO.md)
      VEDA_HOST: "0.0.0.0"
      VEDA_PORT: "8000"
    read_only: true
    tmpfs:                           # questions typed by visitors stay in memory and vanish on restart
      - /app/logs:mode=1777,size=64m
      - /app/data/world:mode=1777,size=16m
      - /tmp:mode=1777,size=64m
    mem_limit: 1g
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [inside]

  feedback:
    profiles: [demo]
    build: { context: feedback }
    image: veda-feedback:demo
    read_only: true
    volumes: [feedback:/data]
    tmpfs: [/tmp:size=8m]
    mem_limit: 128m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [inside]

  proxy:
    profiles: [demo]
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10   # pinned by digest
    entrypoint: ["nginx", "-g", "daemon off;"]     # skip the image's start scripts (they rewrite config files)
    user: "101:101"                                # the image's nginx user; port 8080 needs no root
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["127.0.0.1:${DEMO_PORT:-8765}:8080"]
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=32m"]
    mem_limit: 64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on:
      veda: { condition: service_healthy }
      feedback: { condition: service_started }
    networks: [inside, edge]

networks:
  inside: { internal: true }         # no way out to the internet
  edge: {}                           # only so the proxy's port can be published on 127.0.0.1

volumes:
  feedback: {}                       # the answers (answers.jsonl); kept by `down`, removed only by `down -v`
